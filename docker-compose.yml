services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      INVOICE_PDF_CHROMIUM_PATH: /usr/local/bin/invoice-chromium
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      REDIS_HOST: redis
    volumes:
      - ./opy-realestate-505614-d4e3b5e9f13d.json:/app/opy-realestate-505614-d4e3b5e9f13d.json:ro
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  clamav:
    image: clamav/clamav:1.4.4
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 --wait=30 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - app_network

  database-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL must point to a separate MongoDB Atlas cluster}
      BACKUP_SOURCE_DATABASE_NAME: ${BACKUP_SOURCE_DATABASE_NAME:-}
      BACKUP_CRON: "${BACKUP_CRON:-30 2 * * *}"
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Dhaka}
      BACKUP_DATABASE_PREFIX: ${BACKUP_DATABASE_PREFIX:-real_estate_saas_backup}
      BACKUP_MANIFEST_DATABASE_NAME: ${BACKUP_MANIFEST_DATABASE_NAME:-real_estate_saas_backup_control}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_RECOVERY_POINTS: ${BACKUP_MIN_RECOVERY_POINTS:-7}
      BACKUP_WORK_DIR: /tmp/real-estate-db-backup
      BACKUP_PROCESS_TIMEOUT_MINUTES: ${BACKUP_PROCESS_TIMEOUT_MINUTES:-120}
      BACKUP_LOCK_STALE_MINUTES: ${BACKUP_LOCK_STALE_MINUTES:-360}
      BACKUP_MAX_PARALLEL_COLLECTIONS: ${BACKUP_MAX_PARALLEL_COLLECTIONS:-4}
      BACKUP_ALLOW_SAME_CLUSTER: "false"
      BACKUP_GCS_PROTECTION_MODE: ${BACKUP_GCS_PROTECTION_MODE:-warn}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME:-}
      GCP_KEY_FILE: ${GCP_KEY_FILE:-/app/opy-realestate-505614-d4e3b5e9f13d.json}
    volumes:
      - ./opy-realestate-505614-d4e3b5e9f13d.json:/app/opy-realestate-505614-d4e3b5e9f13d.json:ro
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  clamav_db:
  redis_data:


