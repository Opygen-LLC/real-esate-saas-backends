name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:phase3-security-hardening
      - run: pnpm verify:phase4-release
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:test
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm test:security
      - run: pnpm test:phase4-release:source
      - name: Start transaction-capable MongoDB
        run: |
          docker compose -f docker-compose.ci.yml up -d mongo
          docker compose -f docker-compose.ci.yml run --rm mongo-init
      - name: Phase 4 replica-set release regression
        env:
          TEST_DATABASE_URL: mongodb://127.0.0.1:27017/phase4_release?replicaSet=rs0
        run: pnpm test:phase4-release:integration
      - name: Stop Phase 4 MongoDB
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
