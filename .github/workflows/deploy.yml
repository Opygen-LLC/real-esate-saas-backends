name: CI/CD Pipeline - Real Estate SaaS Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: 🧪 CI - Lint, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Compile TypeScript & Assets
        run: pnpm build

      - name: 🧪 Run Unit Tests
        run: pnpm test:unit

  deploy-to-gcp:
    name: 🚀 CD - Deploy to GCP Compute Engine
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🔑 SSH to GCP VM & Execute Deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: ${{ secrets.GCP_VM_PORT || 22 }}
          script_stop: true
          script: |
            echo "----------------------------------------"
            echo "🚀 Starting Automated GCP Deployment..."
            echo "----------------------------------------"
            
            # Navigate to backend directory
            cd ~/real-esate-saas-backends/server || cd ~/real-esate-saas-backends || cd ~/app/server
            
            # Pull latest changes from main branch
            echo "🔄 Pulling latest code from main branch..."
            git pull origin main
            
            # Make update script executable and run build
            echo "🏗️ Rebuilding & restarting Docker production containers..."
            chmod +x update.sh
            ./update.sh
            
            # Verify health status
            echo "🧪 Verifying container health..."
            sleep 15
            curl -f http://localhost:5000/health || curl -f http://34.131.86.177/health || curl -f http://127.0.0.1:5000/health


            
            echo "----------------------------------------"
            echo "✅ GCP Production Deployment Complete!"
            echo "----------------------------------------"
