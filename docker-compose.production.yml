services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      WORKER_ENABLED: "true"
      DOMAIN_PROVIDER: ${DOMAIN_PROVIDER:?DOMAIN_PROVIDER is required}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:?PUBLIC_SITE_ORIGIN is required}
      # PUBLIC_API_URL must point to the HTTPS domain — this is what the backend
      # uses to build invitation links, cookie settings, and CORS validation.
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL:-https://realestate.opygen.com/api/revalidate}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET:?NEXT_REVALIDATE_SECRET is required}
      VERCEL_PROJECT_ID_OR_NAME: ${VERCEL_PROJECT_ID_OR_NAME:-}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_REQUIRE_TEAM_ID: ${VERCEL_REQUIRE_TEAM_ID:-false}
      DOMAIN_REPLACEMENT_GRACE_HOURS: ${DOMAIN_REPLACEMENT_GRACE_HOURS:-168}
      INVOICE_PDF_CHROMIUM_PATH: /usr/local/bin/invoice-chromium
      # GCS media storage
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME:?GCP_BUCKET_NAME is required}
      GCP_KEY_FILE: ${GCP_KEY_FILE:-/app/opy-realestate-505614-d4e3b5e9f13d.json}
      OBJECT_STORAGE_BROWSER_ORIGIN: ${OBJECT_STORAGE_BROWSER_ORIGIN:-https://realestate.opygen.com}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # MongoDB pool
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-1}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      # Cookie settings — must match domain/HTTPS setup
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: "none"
      # Worker
      WORKER_POLL_MS: ${WORKER_POLL_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      # Redis
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_ALLOW_INSECURE_PRIVATE_NETWORK: "true"
    volumes:
      - ./opy-realestate-505614-d4e3b5e9f13d.json:/app/opy-realestate-505614-d4e3b5e9f13d.json:ro
    # Do NOT expose port 5000 directly to the host in production —
    # only Caddy (the reverse proxy) should reach the API container.
    expose:
      - "5000"
    networks:
      - app_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  database-backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: backup-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL must point to a separate MongoDB cluster}
      BACKUP_SOURCE_DATABASE_NAME: ${BACKUP_SOURCE_DATABASE_NAME:-}
      BACKUP_CRON: "${BACKUP_CRON:-15 3 * * *}"
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Dhaka}
      BACKUP_DATABASE_PREFIX: ${BACKUP_DATABASE_PREFIX:-real_estate_saas_backup}
      BACKUP_MANIFEST_DATABASE_NAME: ${BACKUP_MANIFEST_DATABASE_NAME:-real_estate_saas_backup_control}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MIN_RECOVERY_POINTS: ${BACKUP_MIN_RECOVERY_POINTS:-7}
      BACKUP_WORK_DIR: /tmp/real-estate-db-backup
      BACKUP_PROCESS_TIMEOUT_MINUTES: ${BACKUP_PROCESS_TIMEOUT_MINUTES:-120}
      BACKUP_LOCK_STALE_MINUTES: ${BACKUP_LOCK_STALE_MINUTES:-360}
      BACKUP_MAX_PARALLEL_COLLECTIONS: ${BACKUP_MAX_PARALLEL_COLLECTIONS:-4}
      BACKUP_ALLOW_SAME_CLUSTER: "false"
      BACKUP_GCS_PROTECTION_MODE: ${BACKUP_GCS_PROTECTION_MODE:-warn}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME:-}
      GCP_KEY_FILE: ${GCP_KEY_FILE:-/app/opy-realestate-505614-d4e3b5e9f13d.json}
    volumes:
      - ./opy-realestate-505614-d4e3b5e9f13d.json:/app/opy-realestate-505614-d4e3b5e9f13d.json:ro
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
