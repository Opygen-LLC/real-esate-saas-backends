services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      WORKER_ENABLED: "true"
      DOMAIN_PROVIDER: ${DOMAIN_PROVIDER:?DOMAIN_PROVIDER is required}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:?PUBLIC_SITE_ORIGIN is required}
      NEXT_REVALIDATE_URL: ${NEXT_REVALIDATE_URL:-https://realestate.opygen.com/api/revalidate}
      NEXT_REVALIDATE_SECRET: ${NEXT_REVALIDATE_SECRET:?NEXT_REVALIDATE_SECRET is required}
      VERCEL_PROJECT_ID_OR_NAME: ${VERCEL_PROJECT_ID_OR_NAME:?VERCEL_PROJECT_ID_OR_NAME is required}
      VERCEL_API_TOKEN: ${VERCEL_API_TOKEN:?VERCEL_API_TOKEN is required}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_REQUIRE_TEAM_ID: ${VERCEL_REQUIRE_TEAM_ID:-false}
      DOMAIN_REPLACEMENT_GRACE_HOURS: ${DOMAIN_REPLACEMENT_GRACE_HOURS:-168}
      INVOICE_PDF_CHROMIUM_PATH: /usr/local/bin/invoice-chromium
      # GCS is the single canonical media provider.
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:?GCP_PROJECT_ID is required}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME:?GCP_BUCKET_NAME is required}
      GCP_KEY_FILE: ${GCP_KEY_FILE:-/app/opy-realestate-505614-d4e3b5e9f13d.json}
      OBJECT_STORAGE_BROWSER_ORIGIN: ${OBJECT_STORAGE_BROWSER_ORIGIN:-https://realestate.opygen.com}
      # CLAMAV_HOST is intentionally controlled by deployment environment.
      # Leave empty only when another production malware-scanning path is configured.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # MongoDB pool tuned for current scale (cost audit fix)
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-1}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-10}
      # Worker poll interval reduced to save Atlas ops (cost audit fix)
      WORKER_POLL_MS: ${WORKER_POLL_MS:-30000}
      # Log level set to warn to reduce CPU/stdout volume (cost audit fix)
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      - ./opy-realestate-505614-d4e3b5e9f13d.json:/app/opy-realestate-505614-d4e3b5e9f13d.json:ro
    ports:
      - "5000:5000"
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
