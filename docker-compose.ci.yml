services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 3s
      retries: 40

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      mongosh --host localhost:27017 --quiet --eval
      'try { rs.status(); } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}); }' &&
      until mongosh --host localhost:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true;
      do sleep 2; done
    network_mode: "service:mongo"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: phase7minio
      MINIO_ROOT_PASSWORD: phase7-minio-secret-123456
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set ci http://minio:9000 phase7minio phase7-minio-secret-123456 &&
      mc mb --ignore-existing ci/real-estate-media &&
      mc anonymous set download ci/real-estate-media

  clamav:
    image: clamav/clamav:1.4.4
    environment:
      CLAMAV_NO_MILTERD: "true"
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping=1 --wait=30 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
