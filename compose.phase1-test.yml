# Development/test only. Bound to loopback; no production data or external services.
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports: ["127.0.0.1:27018:27018"]
    tmpfs: ["/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --port 27018 --eval 'try { if (!rs.status().ok) quit(1) } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27018\"}]}); quit(1) }'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
